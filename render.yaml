# Render settings for the Express API (server/).
services:
  - type: web
    name: campus-lost-found-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # your Netlify URL, e.g. https://campus-lost-found.netlify.app
