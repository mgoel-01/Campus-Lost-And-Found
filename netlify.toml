# Netlify settings for the React frontend (client/).
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Forward API calls and uploaded photos to the backend hosted on Render.
[[redirects]]
  from = "/api/*"
  to = "https://campus-lost-and-found-vsn6.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://campus-lost-and-found-vsn6.onrender.com/uploads/:splat"
  status = 200
  force = true

# Let React Router handle every other page (e.g. /items/123) instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
